<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Forge</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="app">
<h1>Invoice Forge</h1>

<section class="card" aria-labelledby="lbl-data">
<h2 id="lbl-data" class="sr-only">Data Invoice</h2>
<div class="grid">
<div class="field">
<label for="inv-nama">Nama Perusahaan</label>
<input id="inv-nama" type="text" placeholder="Nama bisnis Anda" autocomplete="organization">
</div>
<div class="field">
<label for="inv-klien">Nama Klien</label>
<input id="inv-klien" type="text" placeholder="Nama klien" autocomplete="off">
</div>
<div class="field">
<label for="inv-nomor">Nomor Invoice</label>
<input id="inv-nomor" type="text" placeholder="INV-001" autocomplete="off">
</div>
<div class="field">
<label for="inv-tanggal">Tanggal</label>
<input id="inv-tanggal" type="date">
</div>
</div>
</section>

<section class="card" aria-labelledby="lbl-item">
<h2 id="lbl-item">Item</h2>
<div id="daftar-item" class="items"></div>
<div class="actions">
<button type="button" id="btn-tambah-item" class="btn btn-secondary">Tambah Item</button>
</div>
</section>

<section class="card" aria-labelledby="lbl-total">
<h2 id="lbl-total">Ringkasan</h2>
<div class="grid">
<div class="field">
<label for="inv-pajak">Pajak (%)</label>
<input id="inv-pajak" type="number" value="11" min="0" max="100" step="0.1">
</div>
</div>
<div class="summary">
<div class="summary-row"><span>Subtotal</span><span id="val-subtotal">Rp 0</span></div>
<div class="summary-row"><span>Pajak</span><span id="val-pajak">Rp 0</span></div>
<div class="summary-row summary-total"><span>Total</span><span id="val-total">Rp 0</span></div>
</div>
</section>

<section class="card" aria-labelledby="lbl-aksi">
<h2 id="lbl-aksi" class="sr-only">Aksi</h2>
<div class="actions">
<button type="button" id="btn-simpan" class="btn btn-primary">Simpan</button>
<button type="button" id="btn-cetak" class="btn btn-primary">Cetak PDF</button>
<button type="button" id="btn-baru" class="btn btn-secondary">Invoice Baru</button>
<button type="button" id="btn-hapus" class="btn btn-secondary">Hapus Tersimpan</button>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>
</main>
</body>
</html>
